# Tool configuration lives here so that black, isort and pytest agree with each
# other. Dependencies are in requirements.txt / requirements-dev.txt, which
# configure_py.sh installs into ./virtualenv.

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blissflixx"
# The application reports the checkout's git identity at runtime; this number
# exists for the packaging metadata and is set for real when the release is
# tagged.
version = "0.0.0"
description = "A television interface for a Raspberry Pi"
requires-python = ">=3.11"
# Runtime dependencies are listed in requirements.txt, which configure_py.sh
# installs into ./virtualenv. They are not repeated here: one list, one place
# to audit.
dependencies = []

[project.scripts]
blissflixx = "blissflixx.server:main"

[tool.setuptools.packages.find]
# Only the application is ours to install, plus the one-release `lib` alias:
# the server runs as an entry point in virtualenv/bin, so the checkout root is
# not on sys.path and an installed channel's `import lib...` needs the alias to
# be part of the distribution. `plugins` are separate projects loaded by name
# at runtime, not distributions of this one.
include = ["blissflixx*", "lib"]

[tool.black]
# Vendored trees are not ours to format.
extend-exclude = '''
/(
    blissflixx/yt-dlp
  | blissflixx/torrentparse
  | virtualenv
  | oldplugins
)/
'''

[tool.isort]
profile = "black"
known_first_party = ["blissflixx"]
# isort must not walk into the vendored yt-dlp checkout, the dead torrentparse
# package, or third-party plugins installed at runtime.
extend_skip_glob = [
    "blissflixx/yt-dlp/*",
    "blissflixx/torrentparse/*",
    "virtualenv/*",
    "oldplugins/*",
    "plugins/*",
]

[tool.pytest.ini_options]
testpaths = ["test"]
# The project is not installed as a package yet; tests import `blissflixx` from
# the repo root.
pythonpath = ["."]
# Fail fast if a test tries to reach the network. The old scripts in test/ were
# exactly that: they hit live sites and printed whatever came back.
#
# The marker is opt-in rather than opt-out: a live web site answers a test
# differently on a bad afternoon, and the suite had always been offline and
# deterministic until the first marked test existed. Run the live ones with
# pytest -m network.
addopts = "-ra --strict-markers -m \"not network\""
markers = [
    "network: test needs live network access (opt in with '-m network')",
]