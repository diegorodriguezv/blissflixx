<channel>
  <channelheader channel={ channel } query={ query }></channelheader>
  <feedlist feeds={ channel.feeds } active={ feed } page={ '#channel/' + channel.id}></feedlist>
  <!-- What the channel's block list took out of this listing, beside the
       results it belongs to. A row can carry several words, so the per-word
       counts can add up to more than the rows hidden. -->
  <div show={ blocked } class="blocked-report">
    <span if={ blocked.hidden }>{ blocked.hidden } of { blocked.rows } rows blocked</span>
    <span if={ !blocked.hidden }>No rows blocked of { blocked.rows }</span>
    <span each={ w, i in blocked.words }> · { w.word } { w.count }</span>
  </div>
  <itemlist items={ results } wait={ waitMsg } empty={ emptyMsg }></itemlist>
 
  <script>
    var self = this
    var FEED_WAIT = "Loading..."
    var SEARCH_WAIT = "Searching..."
    var FEED_EMPTY = "There are no items for this feed."
    var SEARCH_EMPTY = "There are no results for this query."

    this.on('mount', function() {
      riot.route.exec(function(page, chid, feed, q) {
        self.chid = chid
        // A search from the last channel must not follow the person into
        // this one: without this, every channel opened after a search tried
        // to search itself again.
        self.query = null
        if (feed === 's') {
          self.query = decodeURIComponent(q)
        }
        else {
          // A feed named in the route always wins. When there is none, the
          // channel's own default feed applies, if it has one.
          self.explicitFeed = feed !== undefined && feed !== null && feed !== ''
          self.feed = self.explicitFeed ? parseInt(feed) : 0
        }
        RiotControl.on('se_channels_changed', self.doUpdate)
        self.doUpdate()
      })
    })

    self.on('unmount', function() {
      RiotControl.off('se_channels_changed')
    })

    doUpdate() {
      self.results = null
      self.blocked = null
      channelStore.getChannel(self.chid, function(err, channel) {
        if (err) return Utils.showError(err)
        // A page that throws while drawing leaves the spinner turning for
        // ever with nothing said. Turn it into the error bar instead.
        try {
          self.channel = channel
          if (!channel.feeds) channel.feeds = []
          self.lastIdx = channel.feeds.length - 1
          if (!self.explicitFeed) {
            self.feed = self.defaultFeedIndex(channel.feeds, channel.config)
          }
          self.query ? self.showSearch() : self.showFeed()
          if (channel.full_feeds) {
            channelStore.getFeeds(self.chid, function(err, feeds) {
              if (err || !feeds) return
              try {
                var resolved = self.defaultFeedIndex(feeds, self.channel.config)
                var changed = resolved !== self.feed
                self.channel.feeds = feeds
                if (!self.explicitFeed && changed) {
                  self.feed = resolved
                  if (!self.query) self.showFeed()
                }
                self.update()
              } catch (e) {
                Utils.showError(Utils.createError('channel', e.message || e))
              }
            })
          }
        } catch (e) {
          Utils.showError(Utils.createError('channel', e.message || e))
        }
      })
    }

    //: The index of the feed a channel opens by default, by its title.
    //: Resolved against the list on screen, so a country from IPTV's full
    //: catalogue works once that list has loaded even though it is not in the
    //: curated one.
    defaultFeedIndex(feeds, config) {
      var wanted = String((config || {}).default_feed || '').toLowerCase()
      if (!wanted) return 0
      for (var i = 0; i < (feeds || []).length; i++) {
        if (String(feeds[i].title || '').toLowerCase() == wanted) return i
      }
      return 0
    }

    showSearch() {
      // The query itself is shown by the header, which fills its own box from
      // the `query` the page passes it.
      self.waitMsg = SEARCH_WAIT
      self.emptyMsg = SEARCH_EMPTY
      self.blocked = null
      self.update()
      channelStore.searchChannel(self.chid, self.query, function(err, items, blocked) {
        if (err) return Utils.showError(err)
        self.results = items;
        self.blocked = blocked
        self.update()
      })
    }

    showFeed() {
      self.waitMsg = FEED_WAIT
      self.emptyMsg = FEED_EMPTY
      self.blocked = null
      self.update()
      channelStore.getFeed(self.chid, self.feed, function(err, items, blocked) {
        if (err) return Utils.showError(err)
        self.results = items;
        self.blocked = blocked
        self.update()
      })
    }

  </script>
</channel>
