<settings>
  <div class="row">
    <div class="col-md-4 col-md-offset-4 col-sm-6 col-sm-offset-3 col-xs-12">
      <a href="#chanman" type="button" class="btn btn-primary btn-block btn-lg" ><span class="glyphicon glyphicon-th"></span> MANAGE CHANNELS</a>
      <a href="" onclick={ restart } type="button" class="btn btn-primary btn-block btn-lg"><span class="glyphicon glyphicon-retweet"></span> UPDATE</a>
      <a href="" onclick={ shutdown } type="button" class="btn btn-primary btn-block btn-lg"><span class="glyphicon glyphicon-off"></span> SHUTDOWN</a>
      <a href="" onclick={ reboot } type="button" class="btn btn-primary btn-block btn-lg"><span class="glyphicon glyphicon-repeat"></span> REBOOT</a>

      <!--
      What is on disk, and what this server is actually running, shown
      separately.

      It was one line labelled "running build", and it was wrong. It read the
      checkout, which git pull moves while the server keeps running the code it
      booted with -- so after an update the page reported the new commit for a
      process that had never executed a line of it. On this machine that hid a
      server that had failed to restart and left the old one serving, for a
      whole session, while the page went on certifying the new build.

      Two numbers and a verdict. When they differ, the code answering is not
      the code on disk, which is what a restart fixes.
      -->
      <!-- The bare names, not self.running. riot resolves an expression against
           the tag, and "self" is a variable inside the tag's script rather
           than a property on the tag, so nothing is found under that name and
           it falls back far enough to render an element -- which is what put
           "[object HTMLSpanElement]" on the television. Every other tag in this
           interface refers to its own state the same way. -->
      <p class="build-label">running <span id="build">{ running }</span></p>
      <p class="build-label">installed <span id="installed">{ installed }</span></p>
      <p show={ stale } class="build-stale">
        these differ, so a server is answering that is not the one on disk. Reboot it.
      </p>

      <!--
      What the last UPDATE did, one line per thing it moved.

      It is here because the alternative is a button whose entire effect is
      invisible: an update that changed nothing and an update that changed
      everything both used to be a bar that appeared and went away again, and
      from the outside they were the same event. It also survives the restart,
      because the server writes it down first -- a reply that arrives with the
      process being killed is a reply that does not arrive.
      -->
      <div class="update-report" show={ lastUpdate }>
        <p class="update-report-when">last update { lastUpdate.when }</p>
        <p each={ line in lastUpdate.lines } class="update-report-line">{ line }</p>
      </div>
    </div>
  </div>

  <script>
    var self = this

    // Set before the answer arrives, so the first render has something to show
    // for them. riot evaluates the expressions when the tag is built and the
    // request has not been sent by then; an undefined here would be rendered
    // as the word "undefined" rather than as nothing.
    self.running = '...'
    self.installed = '...'
    self.stale = false

    Utils.rpc('server', 'versions', null, function(err, data) {
      if (err || !data) return
      self.running = data.running
      self.installed = data.installed
      self.stale = data.same ? false : true
      self.update()
    })

    restart() {
      // Said before the call, because the call is slow.
      //
      // Fourteen seconds on a Raspberry Pi: three git operations and a pip
      // against PyPI, none of which is quick and all of which have to finish
      // before there is anything to report. With nothing on screen for those
      // fourteen seconds the block does not change and the button looks broken,
      // which is the same complaint as not having a block at all.
      self.lastUpdate = { when: 'just now', lines: ['checking...'] }
      self.update()
      Utils.rpc('server', 'restart', null, function(err, answer) {
        if (err) {
          // A real refusal: nothing moved, and the reason came back with it.
          self.lastUpdate = { when: 'just now', lines: [Utils.decodeURI(err)] }
          return self.update()
        }
        if (answer && answer.updated === false) {
          // Nothing changed, so the server did not restart and this reply is
          // the whole of the news.
          self.lastUpdate = { when: 'just now', lines: answer.message.split('\n') }
          return self.update()
        }
        // Something moved: the server is on its way down and this reply may
        // never arrive. The bar says so, and the report comes back with the
        // page when it reloads.
      })
    }

    readLastUpdate() {
      Utils.rpc('server', 'last_update', null, function(err, answer) {
        if (err || !answer || !answer.parts || !answer.parts.length) return
        self.lastUpdate = self.describe(answer)
        // Riot does not re-render because a property changed. Every other
        // callback in this file says self.update() for that reason, and this
        // one did not: the answer arrived, the property was set, and the block
        // stayed hidden because nothing asked for the page to be drawn again.
        self.update()
      })
    }

    describe(answer) {
      var lines = []
      var parts = answer.parts || []
      for (var i = 0; i < parts.length; i++) {
        var part = parts[i]
        if (!part.ok) {
          lines.push(part.name + ': not updated -- ' + part.detail)
        } else if (part.changed) {
          lines.push(part.name + ': ' + part.detail)
        } else {
          lines.push(part.name + ': already current')
        }
        if (part.note) lines.push('  ' + part.note)
      }
      var when = ''
      if (answer.at) {
        var then = new Date(answer.at * 1000)
        when = then.toISOString().slice(0, 16).replace('T', ' ') + ' UTC'
      }
      return { when: when, lines: lines }
    }

    // Through powerStore rather than rpc, because the answer is not the end of
    // it: the machine is about to stop answering, and the bar at the bottom of
    // the page has to say so until it starts again.
    shutdown() {
      powerStore.power('shutdown')
    }

    reboot() {
      powerStore.power('reboot')
    }

    // Here, at the bottom, and not at the top with the rest of the start-up.
    //
    // riot turns the shorthand methods in this script into assignments on the
    // tag, in source order, so a call placed above them finds nothing defined
    // yet: readLastUpdate is not a function, the exception aborts the rest of
    // this script, and the buttons below -- restart, shutdown, reboot -- are
    // never defined either. The settings page then renders and does nothing at
    // all, which is exactly what it looked like.
    this.on('mount', function() {
      self.readLastUpdate()
    })
  </script>
</settings>
