<settings>
  <div class="row">
    <div class="col-md-4 col-md-offset-4 col-sm-6 col-sm-offset-3 col-xs-12">
      <a href="#chanman" type="button" class="btn btn-primary btn-block btn-lg" ><span class="glyphicon glyphicon-th"></span> MANAGE CHANNELS</a>
      <a href="" onclick={ restart } type="button" class="btn btn-primary btn-block btn-lg"><span class="glyphicon glyphicon-retweet"></span> UPDATE</a>
      <a href="" onclick={ shutdown } type="button" class="btn btn-primary btn-block btn-lg"><span class="glyphicon glyphicon-off"></span> SHUTDOWN</a>
      <a href="" onclick={ reboot } type="button" class="btn btn-primary btn-block btn-lg"><span class="glyphicon glyphicon-repeat"></span> REBOOT</a>

      <!--
      The build this page is talking to, read from the server rather than
      written into the page.

      It is here because "the reboot bar does not appear" and "this browser has
      been running a build from three days ago" are indistinguishable from the
      outside, and guessing between them cost an afternoon. A number on the
      screen answers it in a second, and it keeps answering it for whoever
      finds the next thing that works on the Pi and not in the browser.
      -->
      <!-- The bare name, not self.build. riot resolves an expression against
           the tag, and "self" is a variable inside the tag's script rather
           than a property on the tag, so nothing is found under that name and
           it falls back far enough to render an element -- which is what put
           "[object HTMLSpanElement]" on the television. Every other tag in this
           interface refers to its own state the same way. -->
      <p class="build-label">running build <span id="build">{ build }</span></p>

      <!--
      What the last UPDATE did, one line per thing it moved.

      It is here because the alternative is a button whose entire effect is
      invisible: an update that changed nothing and an update that changed
      everything both used to be a bar that appeared and went away again, and
      from the outside they were the same event. It also survives the restart,
      because the server writes it down first -- a reply that arrives with the
      process being killed is a reply that does not arrive.
      -->
      <div class="update-report" show={ lastUpdate }>
        <p class="update-report-when">last update { lastUpdate.when }</p>
        <p each={ lastUpdate.lines } class="update-report-line">{ . }</p>
      </div>
    </div>
  </div>

  <script>
    var self = this

    Utils.rpc('server', 'version', null, function(err, data) {
      if (err) return
      self.build = data
      self.update()
    })
    self.readLastUpdate()

    restart() {
      self.busy = true
      self.report = null
      self.update()
      Utils.rpc('server', 'restart', null, function(err, answer) {
        self.busy = false
        if (err) {
          // A real refusal: nothing moved, and the reason came back with it.
          self.report = { when: '', lines: [Utils.decodeURI(err).replace(/%3A/g, ':')] }
          return self.update()
        }
        if (answer && answer.updated === false) {
          // Nothing changed, so the server did not restart and this reply is
          // the whole of the news.
          self.report = { when: 'just now', lines: answer.message.split('\n') }
          return self.update()
        }
        // Something moved: the server is on its way down and this reply may
        // never arrive. The bar says so, and the report comes back with the
        // page when it reloads.
      })
    }

    readLastUpdate() {
      Utils.rpc('server', 'last_update', null, function(err, answer) {
        if (err || !answer || !answer.parts || !answer.parts.length) return
        self.lastUpdate = self.describe(answer)
      })
    }

    describe(answer) {
      var lines = []
      var parts = answer.parts || []
      for (var i = 0; i < parts.length; i++) {
        var part = parts[i]
        if (!part.ok) {
          lines.push(part.name + ': not updated -- ' + part.detail)
        } else if (part.changed) {
          lines.push(part.name + ': ' + part.detail)
        } else {
          lines.push(part.name + ': already current')
        }
        if (part.note) lines.push('  ' + part.note)
      }
      var when = ''
      if (answer.at) {
        var then = new Date(answer.at * 1000)
        when = then.toISOString().slice(0, 16).replace('T', ' ') + ' UTC'
      }
      return { when: when, lines: lines }
    }

    // Through powerStore rather than rpc, because the answer is not the end of
    // it: the machine is about to stop answering, and the bar at the bottom of
    // the page has to say so until it starts again.
    shutdown() {
      powerStore.power('shutdown')
    }

    reboot() {
      powerStore.power('reboot')
    }
  </script>
</settings>
