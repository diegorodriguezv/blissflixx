<chanman>
  <itemlist items={ chanlist }></itemlist>

  <script>
    var self = this
    self.chanlist = []

    this.on('mount', function() {
      RiotControl.on('se_channels_changed', self.doUpdate)
      self.doUpdate()
    })

    this.on('unmount', function() {
      RiotControl.off('se_channels_changed')
    })

    doUpdate() {
      channelStore.getChannels(function(err, chanlist) {
        if (err) return Utils.showError(err)
        self.chanlist = chanlist
        self.update()
      })
    }

    /*
     * Clicking a channel opens the channel.
     *
     * The icon and the title are how you get into a channel, so they go to the
     * channel and not out of the application. The website is on the Source
     * button beside Disable, which is there for the question "where does this
     * come from" rather than for "show me this channel".
     *
     * itemlist's own openItem plays whatever url it is handed. That is right for
     * a video and meaningless for a channel, which carries no url at all --
     * reaching into one threw a TypeError and did nothing visible.
     */
    openItem(e) {
      Utils.goRoute('channel', e.item.id)
    }
  </script>
</chanman>
