<chanman>
  <itemlist items={ chanlist }></itemlist>

  <!--
  The settings for the channel whose Settings button was pressed. One form,
  reused: choosing another channel replaces what it is showing. A direct link
  to #chansettings/<chid> still works, through the chansettings page.
  -->
  <div if={ selected } class="row">
    <div class="col-md-6 col-md-offset-3 col-sm-8 col-sm-offset-2 col-xs-12">
      <hr />
      <h4 class="settings-subtitle">Channel settings</h4>
      <channelsettings chid={ selected }></channelsettings>
      <a href="" onclick={ closeSettings } class="btn btn-link">Close</a>
    </div>
  </div>

  <script>
    var self = this
    self.chanlist = []
    self.selected = null

    this.on('mount', function() {
      RiotControl.on('se_channels_changed', self.doUpdate)
      RiotControl.on('se_channel_settings', self.openSettings)
      self.doUpdate()
    })

    this.on('unmount', function() {
      RiotControl.off('se_channels_changed')
      RiotControl.off('se_channel_settings')
    })

    openSettings(chid) {
      self.selected = chid
      self.update()
      // The list can be long; the form opens under it, so bring it into view.
      setTimeout(function() {
        var form = self.root && self.root.querySelector('.channel-settings')
        if (form && form.scrollIntoView) {
          form.scrollIntoView({behavior: 'smooth', block: 'start'})
        }
      }, 50)
    }

    closeSettings(e) {
      if (e) e.preventDefault()
      self.selected = null
      self.update()
    }

    doUpdate() {
      channelStore.getChannels(function(err, chanlist) {
        if (err) return Utils.showError(err)
        self.chanlist = chanlist
        self.update()
      })
    }

    /*
     * Clicking a channel opens the channel.
     *
     * The icon and the title are how you get into a channel, so they go to the
     * channel and not out of the application. The website is on the Source
     * button beside Disable, which is there for the question "where does this
     * come from" rather than for "show me this channel".
     *
     * itemlist's own openItem plays whatever url it is handed. That is right for
     * a video and meaningless for a channel, which carries no url at all --
     * reaching into one threw a TypeError and did nothing visible.
     */
    openItem(e) {
      Utils.goRoute('channel', e.item.id)
    }
  </script>
</chanman>
