<sysoptions>
  <div class="row">
    <div class="col-md-6 col-md-offset-3 col-sm-8 col-sm-offset-2 col-xs-12">
      <span class="item-list-title">
        <backbtn></backbtn> <span>System options</span>
      </span>

      <p show={ loading } class="search-note">Loading...</p>
      <p show={ errorMsg } class="alert alert-warning">{ errorMsg }</p>

      <form show={ !loading && !errorMsg } onsubmit={ save }>
        <div class="form-group">
          <label for="bf-title">Title</label>
          <input id="bf-title" name="f_title" class="form-control" type="text" value={ title }>
          <p class="help-block">
            The name on the bar and in the browser tab. Leave it empty for
            BlissFlixx.
          </p>
        </div>

        <div class="form-group">
          <label for="bf-global-lang">Default subtitle language</label>
          <select id="bf-global-lang" name="f_lang" class="form-control">
            <option each={ l in languages }
                    value={ l.code }
                    __selected={ l.code == lang }>{ l.name }</option>
          </select>
          <p class="help-block">
            Used by channels that do not choose a language of their own.
          </p>
        </div>

        <button type="submit" class="btn btn-primary btn-spacer-right">Save</button>
        <span show={ saved } class="search-note">Saved.</span>
      </form>
    </div>
  </div>

  <script>
    var self = this
    self.title = ''
    self.lang = 'eng'
    self.languages = []
    self.loading = true
    self.saving = false
    self.saved = false
    self.errorMsg = ''

    // Two reads, one form: the title and the language come from different
    // places and both have to arrive before anything is drawn as loaded.
    var pending = 2

    function loaded() {
      pending--
      if (pending <= 0) {
        self.loading = false
        self.update()
      }
    }

    function failed(err) {
      self.loading = false
      self.errorMsg = Utils.decodeURI(err)
      self.update()
    }

    Utils.rpc('system', 'settings', null, function(err, data) {
      if (err) return failed(err)
      self.title = data.title
      loaded()
    })

    Utils.rpc('subtitles', 'language', null, function(err, data) {
      if (err) return failed(err)
      self.lang = data.lang
      self.languages = data.languages || []
      loaded()
    })

    save(e) {
      if (e) e.preventDefault()
      if (self.saving) return
      self.saving = true
      self.saved = false
      Utils.rpc('system', 'set_settings', {values: {title: self.f_title.value}}, function(err, data) {
        if (err) {
          self.saving = false
          self.errorMsg = Utils.decodeURI(err)
          return self.update()
        }
        self.title = data.title
        RiotControl.trigger('se_title_changed', data.title)
        Utils.rpc('subtitles', 'set_language', {lang: self.f_lang.value}, function(err2, data2) {
          self.saving = false
          if (err2) {
            self.errorMsg = Utils.decodeURI(err2)
            return self.update()
          }
          self.lang = data2.lang
          self.saved = true
          self.update()
          // Saving is the end of this page: go back to Settings, the way the
          // back arrow does, with the confirmation waiting there. A direct
          // visit has nothing behind it, so it goes to Settings instead.
          Utils.flash('Saved.')
          if (window.history.length > 1) {
            window.history.back()
          } else {
            Utils.goRoute('settings')
          }
        })
      })
    }
  </script>
</sysoptions>
