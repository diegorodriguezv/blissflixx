<torrfiles>
  <div class="row break-long-word">
    <span class="col-xs-12 item-list-title">
    <backbtn></backbtn> <span>{ title }</span>
    <span show={ counts } class="item-subtitle"> · { counts }</span>
    </span>
  </div>
  <hr />
  <itemlist items={ results } wait="Retrieving metadata..." empty="There are no video files in this torrent."></itemlist>

  <script>
    var self = this

    this.on('mount', function() {
      self.results = null
      riot.route.exec(function(page, title, link) {
        self.title = decodeURIComponent(title)
        self.link = decodeURIComponent(link)
        self.update()
        Utils.rpc('torrent', 'files', {link:self.link}, function(err, items) {
          if (err) return Utils.showError(err)
          self.results = items;
          var videos = 0, subs = 0
          ;(items || []).forEach(function(it) {
            if (it.img && it.img.indexOf('subtitles.svg') >= 0) subs++
            else if (it.img && it.img.indexOf('film.svg') >= 0) videos++
          })
          self.counts = videos + ' video' + (videos == 1 ? '' : 's') +
            ' · ' + subs + ' subtitle' + (subs == 1 ? '' : 's')
          self.update()
        })
      })
    })
  </script>
</torrfiles>
