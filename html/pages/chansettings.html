<chansettings>
  <div class="row">
    <div class="col-md-6 col-md-offset-3 col-sm-8 col-sm-offset-2 col-xs-12">
      <span class="item-list-title">
        <backbtn></backbtn> <span>Channel settings</span>
      </span>
      <channelsettings chid={ chid }></channelsettings>
    </div>
  </div>

  <script>
    var self = this
    this.on('mount', function() {
      riot.route.exec(function(page, chid) {
        self.chid = chid
        self.update()
      })
    })
  </script>
</chansettings>
