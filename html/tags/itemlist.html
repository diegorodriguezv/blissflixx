<itemlist>
  <div hide={ opts.items } class="item-list-msg">
    <i class="fa fa-spinner fa-spin"></i> { opts.wait }
  </div>
  <div class="item-list-msg" show={ opts.items && opts.items.length == 0 }>{ opts.empty }</div>
  <div show={ opts.items && opts.items.length > 0 }>
    <div each={ opts.items }>
      <div class="item-row row">
         <div class="col-md-2 col-sm-3 col-xs-3">
          <!--
          The href is where the click actually goes: the channel, inside this
          application, as "#channel/<id>". It said the channel's website
          instead, which is the Source button's job and is one button further
          along -- a link naming somewhere the click does not go is worse than
          no link at all.

          "route" comes from the server, which is the one that knows this row is
          a channel and what it is called. Guessing it here from the presence of
          a website would leave a channel without one with nowhere to point.

          Only a channel has one. Every other row here -- a video, a playlist
          entry, a search result -- is played rather than opened, so its href
          stays "", which resolves to the page you are already on.

          The hover text is the name, not the address, and deliberately not the
          same thing the href says. On a television the browser's own line is
          never seen and the tooltip is all a person gets to read, and
          "#channel/bfch_r_documentaries" tells them nothing they did not already
          know from the row they are pointing at -- "Documentaries" tells them
          what is about to open. The address is still there, in the href, for
          the browser's line and for middle-click.

          The icon carries no text of its own, so this is the only label it has.
          -->
          <a href={ route || '' } title={ title } onfocus="this.blur()" onclick={ parent.openItem }>
            <img class={ item-icon: parent.isIcon(img), item-img: !parent.isIcon(img) } src={ img }>
          </a>
        </div>
         <div class="col-md-10 col-sm-9 col-xs-9 break-long-word">
          <a href={ route || '' } title={ title } onfocus="this.blur()" onclick={ parent.openItem }><span class="item-title">{ title }</span></a>
          <div class="item-subtitle"><raw content={ subtitle } /></div>
          <div class="item-synopsis"><raw content={ synopsis } /></div>
          <span each={ actions }>
             <!--
             The href and the hover text, where the action has a real
             destination. Source is one link with a function attached to it, so
             it should look like one: the browser's own hover line names where
             it goes, and middle-click opens it without going through the
             function at all.

             "dest" rather than "url": inside each={ actions } an expression
             takes the action's own properties first and the row's after, so a
             bare "url" finds the row's url for any action that has no url of its
             own -- which is every action but this one, and would have put a
             video's address on its Disable button.

             The hover text is the hint, then the destination, then the label.
             All three because all three are different questions: a hint answers
             "what will this do", Source answers "where does this go", and the
             rest have nothing to say beyond their own name. The hint comes
             first because it is written for the person reading it -- "Search
             IMDb" rather than a sixty-character search address -- and a
             destination is only worth showing when there is no such sentence.
             On a television the browser's own line is never seen, so the
             tooltip is the only one there is.

             Every one of them falls back, because an action with a hint is two
             out of three here and an action with a destination is one, and
             title="undefined" on every button would be worse than nothing said.
             -->
             <a href={ dest || '' }
                title={ hint || dest || label }
                onclick={ parent.parent.doAction }
                class="item-action"><i show={ icon } class="fa { icon }"></i>{ label }</a>
          </span>
        </div>
      </div>
      <hr />
    </div>
  <div>

  <script>
    var self = this

    isIcon(img) {
      if (img) return img.lastIndexOf('/img/icons', 0) === 0 
      return false
    }

    openItem(e) {
      /* Parent can override default openItem */
      if (self.parent.openItem) {
        // Returned, not just called: riot only leaves an anchor's own behaviour
        // alone when the handler returns true, so an override that wants the
        // browser to follow the href has to be able to say so.
        return self.parent.openItem(e)
      } else {
        var item = e.item
        // Not every row here is something to play. A channel in the manager has
        // no url at all, and reaching into one used to throw a TypeError on the
        // click rather than doing nothing.
        if (!item || !item.url) return
        if (item.url.indexOf('search://') === 0) {
          Utils.goRoute('search', item.url.substring(9))
        } else if (item.url.indexOf('showmore://') === 0) {
          var url = item.url.substring(11)
          Utils.goRoute('showmore', item.chid, item.title, url)
        } else {
          // A playlist row is played from where it sits, so that what follows
          // it follows it. Both fields are on the row already for that; a row
          // from anywhere else has neither and plays by itself.
          // The row's own subtitles travel with the play: a torrent's
          // subtitle files and a film's embedded track then arrive with the
          // film rather than behind a button.
          playerStore.play(item.url, item.title, function(err) {
            if (err) return Utils.showError(err)
          }, item.playlist, item.itemnum, item.subs)
        }
      }
    }

    removeFromPlaylist(plid, item) {
      /* Do not make user wait for delete */
      var items = self.opts.items
      for (i=0; i<items.length;i++) {
        if (item === items[i]) {
           self.opts.items = items.splice(i, 1)
           self.update()
           break
        }
      }
      playlistStore.removeItem(plid, item, function(err) {
        if (err) return Utils.showError(err)
      })
    }

    addToPlaylist(plid, item) {
      playlistStore.addItem(plid, item, function(err) {
        if (err) return Utils.showError(err)
      })
    }

    getItemForAction(action) {
      for (i=0; i<opts.items.length; i++) {
        var actions = opts.items[i].actions
        if (!actions) continue
        for (j=0; j<actions.length; j++) {
          if (actions[j] === action) {
            return opts.items[i]
          }
        }
      }
    }

    doAction(e) {
      var action = e.item
      var item = self.getItemForAction(action)
      switch (action.type) {
      case 'addplaylist':
        Popovers.addToPlaylist(e, function(create, value) {
          if (create) {
            playlistStore.newPlaylist(value, function(err, playlist) {
              if (err) return Utils.showError(err)
              self.addToPlaylist(playlist.plid, item)
            })
          } else {
            self.addToPlaylist(value, item)
          }
        })
        break
      case 'showmore':
        Utils.goRoute('showmore', action.chid, action.title, action.link)
        break
      case 'addsubtitles':
        // The search page needs the release name, because that is what says
        // which film it is; it searches by what the name means.
        Utils.goRoute('subsearch', item.url, item.title)
        break
      case 'torrfiles':
        Utils.goRoute('torrfiles', action.title, action.link)
        break
      case 'delplaylist':
        Popovers.areYouSure(e, function(yes) {
          if (yes) {
	    playlistStore.deletePlaylist(item.plid, function(err) {
	      if (err) return Utils.showError(err)
	    })
          }
        })
        break
      case 'delplaylistitem':
        Popovers.areYouSure(e, function(yes) {
          if (yes) {
            self.removeFromPlaylist(item.playlist, item)
          }
        })
        break
      case 'editplaylist':
        Utils.goRoute('playedit', 'playlist', item.plid)
        break
      case 'editplaylistitem':
        Utils.goRoute('playedit', 'item', item.playlist, item.itemnum)
        break
      case 'disablechannel':
        channelStore.toggleChannel(item.id, true, function(err) {
	  if (err) return Utils.showError(err)
        })
        break
      case 'enablechannel':
        channelStore.toggleChannel(item.id, false, function(err) {
	  if (err) return Utils.showError(err)
        })
        break
      case 'sourcechannel':
      case 'imdbsearch':
        // Where the channel's posts come from, and what this torrent is, in a
        // new tab so the page is still there afterwards -- which is the point
        // of looking either of them up. The href carries the same address, so
        // middle-click and right-click already do this without the function.
        window.open(action.dest, '_blank', 'noopener')
        break
      }
    }
  </script>
</itemlist>
