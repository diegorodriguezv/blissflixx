<playbar>
  <playerr show={ powerMsg || ((status.Error || status.Notice) && !errorClosed) } status={ status } msg={ powerMsg } ></playerr>

  <div show={ status.State } class="navibar playnav">
    <div class="container">
      <ul class="navitems navitems-left">
        <li>
          <span class="now-playing">
            <i show={ starting } class="fa fa-circle-o-notch fa-spin"></i>
            <i show={ !starting } class="fa fa-play"></i>
            <span class="truncate">{ status.Title }</span>
            <span show={ pill } class="starting-time { pillClass }" onclick={ showDebug } title={ pillTitle }>
              { pill }
              <i show={ warning } class="fa fa-exclamation-triangle"></i>
            </span>
          </span>
        </li>
      </ul>
      <ul class="navitems navitems-right">
        <li>
          <a href="" onclick={ stop }><i class="fa fa-stop"></i></a>
        </li>
        <li class={ 'inactive-slot': status.State != 3 || starting }>
          <a href="" onclick={ togglePause }><i class={ status.Paused ? 'fa fa-play' : 'fa fa-pause' }></i></a>
        </li>
        <li class={ 'inactive-slot': status.State != 3 || starting }>
          <a href="" onclick={ showRemote }><i class="fa fa-sliders"></i></a>
        </li>
      </ul>
    </div>
  </div>

  <div class="modal" id="debugModal" tabindex="-1">
    <div class="modal-dialog debug-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <button type="button" class="close" onclick={ hideDebug }>&nbsp;&nbsp;X&nbsp;&nbsp;</button>
        </div>
        <div class="modal-body debug-body">
          <pre class="debug-pre">{ debugText }</pre>
        </div>
      </div>
    </div>
  </div>

  <div class="modal" id="remoteModal" tabindex="-1">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <button type="button" class="close" onclick={ hideRemote }>&nbsp;&nbsp;X&nbsp;&nbsp;</button>
        </div>
        <div class="modal-body">
          <div class="container-fluid">
            <div class="row">
              <div class="col-xs-6"><button onclick={ doMinus30 } type="button" class="btn btn-info btn-lg btn-block"><i class="fa fa-backward"></i> 30 SECS</button></div>
              <div class="col-xs-6"><button onclick={ doPlus30 } type="button" class="btn btn-info btn-lg btn-block"><i class="fa fa-forward"></i> 30 SECS</button></div>
            </div>
            <div class="row">
              <div class="col-xs-6"><button onclick={ doMinus600 } type="button" class="btn btn-info btn-lg btn-block"><i class="fa fa-fast-backward"></i> 10 MINS</button></div>
              <div class="col-xs-6"><button onclick={ doPlus600 } type="button" class="btn btn-info btn-lg btn-block"><i class="fa fa-fast-forward"></i> 10 MINS</button></div>
            </div>
            <div class="row">
              <div show={ !status.Paused } class="col-xs-6"><button onclick={ pause } type="button" class="btn btn-info btn-lg btn-block"><i class="fa fa-pause"></i> PAUSE</button></div>
              <div show={ status.Paused } class="col-xs-6"><button onclick={ pause } type="button" class="btn btn-info btn-lg btn-block"><i class="fa fa-play"></i> PLAY</button></div>
              <div class="col-xs-6"><button onclick={ stop } type="button" class="btn btn-info btn-lg btn-block"><i class="fa fa-stop"></i> STOP</button></div>
            </div>
            <div class="row" show={ status.Playlist }>
              <div class="col-xs-6"><button onclick={ doPrevItem } type="button" class="btn btn-info btn-lg btn-block"><i class="fa fa-step-backward"></i> PREV ITEM</button></div>
              <div class="col-xs-6"><button onclick={ doNextItem } type="button" class="btn btn-info btn-lg btn-block"><i class="fa fa-step-forward"></i> NEXT ITEM</button></div>
            </div>
            </br> 
            <div class="row">
              <div class="col-xs-6"><button onclick={ doVoldown } type="button" class="btn btn-info btn-lg btn-block"><i class="fa fa-volume-down"></i> VOL DOWN</button></div>
              <div class="col-xs-6"><button onclick={ doVolup } type="button" class="btn btn-info btn-lg btn-block"><i class="fa fa-volume-up"></i> VOL UP</button></div>
            </div>
            <div class="row">
              <div class="col-xs-6"><button onclick={ doMute } type="button" class="btn btn-info btn-lg btn-block"><i class="fa fa-volume-off"></i> MUTE</button></div>
              <div class="col-xs-6"><button onclick={ addSubtitles } type="button" class="btn btn-info btn-lg btn-block"><i class="fa fa-plus"></i> ADD SUBS</button></div>
            </div>
            <div class="row">
              <div class="col-xs-6"><button onclick={ doPrevAudio } type="button" class="btn btn-info btn-lg btn-block"><i class="fa fa-file-audio-o"></i> PREV AUDIO</button></div>
              <div class="col-xs-6"><button onclick={ doNextAudio } type="button" class="btn btn-info btn-lg btn-block"><i class="fa fa-file-audio-o"></i> NEXT AUDIO</button></div>
            </div>
            </br>
            <div class="row">
              <div class="col-xs-6"><button onclick={ doShowSub } type="button" class="btn btn-info btn-lg btn-block"><i class="fa fa-comment"></i> SHOW SUBS</button></div>
              <div class="col-xs-6"><button onclick={ doHideSub } type="button" class="btn btn-info btn-lg btn-block"><i class="fa fa-comment"></i> HIDE SUBS</button></div>
            </div>
            <div class="row">
              <div class="col-xs-6"><button onclick={ doPrevSub } type="button" class="btn btn-info btn-lg btn-block"><i class="fa fa-comment"></i> PREV SUBS</button></div>
              <div class="col-xs-6"><button onclick={ doNextSub } type="button" class="btn btn-info btn-lg btn-block"><i class="fa fa-comment"></i> NEXT SUBS</button></div>
            </div>
            <div class="row">
              <div class="col-xs-6"><button onclick={ doSubMinus } type="button" class="btn btn-info btn-lg btn-block"><i class="fa fa-comment"></i> -250 MS</button></div>
              <div class="col-xs-6"><button onclick={ doSubPlus } type="button" class="btn btn-info btn-lg btn-block"><i class="fa fa-comment"></i> +250 MS</button></div>
            </div>
         </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    var self = this

    //: Polls with no state before the player counts as stopped.
    //:
    //: A skip stops the film playing before it starts the next one, and the
    //: server reports no state at all in between: the pipeline is stopping, and
    //: that is a real second rather than a blip -- it is VLC being given the
    //: time to release the display before the next film takes it. The page
    //: polls once a second, so closing this panel on the first silent poll shut
    //: it on every NEXT ITEM, and it had to be opened again to press the button
    //: a second time.
    //:
    //: Six is more than the five seconds the pipeline allows a stage to stop, so
    //: one item changing into another is not a stop -- and the end of a film
    //: still closes the panel, which is what the rule is for.
    var SILENT_POLLS = 6

    //: How long the count stays after the picture starts.
    //:
    //: It is the answer to "how long did that take", and it used to vanish at
    //: the moment it became answerable: the film starts, the wait is over, the
    //: number goes. Five seconds is long enough to read it and short enough not
    //: to sit on the bar while the film plays.
    var PILL_LINGER = 5000

    //: How far the clock may run ahead of the last position the server read.
    //:
    //: The position is sampled once a second, so showing the raw number makes
    //: the clock tick unevenly. Interpolating smooths it, but only a little:
    //: if the picture has actually stopped, the position stops changing and
    //: the clock has to look stopped too, not invent the seconds the player
    //: is not producing. One and a half seconds covers a poll and a half.
    var CLOCK_LEAD = 1.5

    this.on('mount', function() {
      self.powerMsg = powerStore.getMsg()
      self.silentPolls = 0
      self.lastCount = ''
      self.lingering = false
      self.updateStatus()
      RiotControl.on('se_status_changed', self.updateStatus)
      RiotControl.on('se_power_changed', self.updatePower)
      // Separate from the poll: the poll carries the sample, this makes the
      // clock between samples look like a clock.
      //
      // It must not touch the pill while the count is up. The count is the
      // answer to "how long did that take" and it stays for PILL_LINGER after
      // the picture starts; a ticker that wrote the clock over it in the
      // meantime produced both numbers in the same place, flickering once a
      // second as each overwrote the other.
      self.clockTimer = setInterval(function() {
        if (!self.status || self.status.State != 3) return
        if (self.starting || self.lingering) return
        var text = self.clockText()
        if (!text || text === self.pill) return
        self.pill = text
        self.update()
      }, 250)
    })

    this.on('unmount', function() {
      if (self.lingerTimer) clearTimeout(self.lingerTimer)
      if (self.clockTimer) clearInterval(self.clockTimer)
      self.stopDebugPolling()
      RiotControl.off('se_status_changed')
      RiotControl.off('se_power_changed')
    })

    updateStatus() {
      self.status = playerStore.getStatus()
      // Loading, for the count beside the title.
      //
      // Starting covers both of the ways a film can be not-on-screen: the
      // pipeline is still resolving it (State 1, which includes eight to twenty
      // seconds of yt-dlp), or the player is up and the source has sent nothing
      // (status.Waiting, which is a torrent with no peers). The second used to
      // look exactly like playing, because the pipe is running either way.
      var wasStarting = self.starting
      self.starting = !!self.status.State &&
                      (self.status.State < 3 || !!self.status.Waiting)
      if (self.starting && self.status.Elapsed) {
        self.lastCount = self.status.Elapsed + 's'
      }
      if (wasStarting && !self.starting && self.lastCount) {
        // The picture started. Hold the number that said how long it took.
        self.lingering = true
        if (self.lingerTimer) clearTimeout(self.lingerTimer)
        self.lingerTimer = setTimeout(function() {
          self.lingering = false
          self.lastCount = ''
          // Hand the pill over to the clock here rather than on the next poll,
          // which can be up to a second away: without this the count sat there
          // for a moment with the film already running under it.
          self.pill = self.clockText() || ''
          self.update()
        }, PILL_LINGER)
      }
      if (!self.starting && !self.lingering) self.lastCount = ''
      // The sample the clock runs from, and when it was taken. The ticker adds
      // the time since then; see clockText.
      if (typeof self.status.Position === 'number') {
        self.posBase = self.status.Position
        self.posAt = Date.now()
      } else {
        self.posBase = null
      }
      // Stalled is two different problems and two different colours: the
      // picture not moving is happening now, the swarm going quiet is going to
      // happen. A film that is not on screen yet is neither -- it is loading,
      // and the detail line already says what it is waiting for.
      var stalled = self.starting ? 0 : (self.status.Stalled || 0)
      var reason = self.status.StallReason || ''
      self.warning = stalled > 0
      self.pillClass = stalled ? (reason == 'picture' ? 'stalled' : 'warn') : ''
      if (stalled) {
        self.pillTitle = (reason == 'picture'
          ? 'The picture has not moved for ' + stalled + ' seconds.'
          : 'Nothing has arrived from the torrent for ' + stalled + ' seconds.') +
          ' Click for details.'
      } else {
        self.pillTitle = 'Click for details'
      }
      if (self.starting || self.lingering) {
        self.pill = self.lastCount
      } else if (self.status.State == 3) {
        self.pill = self.clockText()
      } else {
        self.pill = ''
      }
      // What the source is doing. Only while the film is not on screen: once it
      // plays, the picture says more than a percentage can.
      self.detail = self.starting ? (self.status.Detail || '') : ''
      // The bar stays closed once closed until there is nothing to say, so a
      // notice about a film that has since been dealt with does not come back
      // on the next poll. Both kinds count, not just errors.
      if (!self.status.Error && !self.status.Notice) self.errorClosed = false
      self.silentPolls = self.status.State ? 0 : self.silentPolls + 1
      if (self.showing && self.silentPolls > SILENT_POLLS) self.hideRemote()
      self.update()
    }

    updatePower() {
      self.powerMsg = powerStore.getMsg()
      self.update()
    }

    //: Where the film is, as a clock. See CLOCK_LEAD.
    clockText() {
      if (self.posBase === null || self.posBase === undefined) return ''
      var lead = self.status && self.status.Paused
        ? 0
        : Math.min((Date.now() - self.posAt) / 1000, CLOCK_LEAD)
      return self.formatClock(self.posBase + lead)
    }

    formatClock(seconds) {
      var total = Math.max(0, Math.floor(seconds))
      var h = Math.floor(total / 3600)
      var m = Math.floor((total % 3600) / 60)
      var s = total % 60
      var mm = h ? ('0' + m).slice(-2) : String(m)
      return (h ? h + ':' : '') + mm + ':' + ('0' + s).slice(-2)
    }

    showDebug() {
      self.debugText = 'reading…'
      self.update()
      $('#debugModal').modal('show')
      $('#debugModal').on('hide.bs.modal', self.removeDebugStyle)
      self.fetchDebug()
      self.stopDebugPolling()
      self.debugTimer = setInterval(self.fetchDebug, 1000)
    }

    hideDebug() {
      $('#debugModal').modal('hide')
    }

    removeDebugStyle(e) {
      $('#debugModal').removeAttr('style')
      self.stopDebugPolling()
    }

    stopDebugPolling() {
      if (self.debugTimer) {
        clearInterval(self.debugTimer)
        self.debugTimer = null
      }
    }

    fetchDebug() {
      Utils.rpc('playr', 'debug', null, function(err, data) {
        if (err) {
          self.debugText = 'could not read: ' + err
        } else {
          self.debugText = self.renderDebug(data)
        }
        self.update()
      })
    }

    pad(text, width) {
      var s = String(text === null || text === undefined ? '' : text)
      while (s.length < width) s += ' '
      return s + ' '
    }

    bytes(value) {
      var n = Number(value) || 0
      if (n >= 1024 * 1024 * 1024) return (n / 1024 / 1024 / 1024).toFixed(2) + ' GB'
      if (n >= 1024 * 1024) return (n / 1024 / 1024).toFixed(1) + ' MB'
      if (n >= 1024) return (n / 1024).toFixed(0) + ' kB'
      return n + ' B'
    }

    num(value) {
      return value === null || value === undefined ? '—' : String(value)
    }

    stateName(state) {
      if (state == 3) return 'playing'
      if (state == 1) return 'starting'
      return 'stopped'
    }

    //: The panel. Everything the server could say, laid out to be read from a
    //: sofa: one section per question, in the order they are asked when
    //: something goes wrong -- where is it, is anything arriving, is the
    //: player alive, what is it decoding, and what does the machine have left.
    renderDebug(d) {
      var p = d.Playback || {}
      var src = d.Source || {}
      var swarm = src.swarm || {}
      var sw = swarm
      var file = src.file || {}
      var player = d.Player || {}
      var pb = player.playback || {}
      var stats = pb.stats || {}
      var out = []
      var line = function(key, value) {
        out.push('  ' + self.pad(key, 13) +
          (value === null || value === undefined || value === '' ? '—' : value))
      }
      out.push('NOW')
      line('title', p.title)
      line('state', self.stateName(p.state) +
        (p.paused ? ' · paused' : '') + (p.waiting ? ' · waiting for picture' : ''))
      var pos = p.position === null || p.position === undefined ? '—' : self.formatClock(p.position)
      if (p.length) pos += ' / ' + self.formatClock(p.length) +
        ' (' + Math.floor(p.position * 100 / p.length) + '%)'
      line('position', pos)
      line('asked for', p.elapsed + 's ago')
      line('stalled', p.stalled ? p.stalled + 's · ' + p.stall_reason : 'no')
      if (p.error) line('error', p.error)
      out.push('')
      out.push('SOURCE')
      line('file', file.name)
      line('on disk', file.length
        ? self.bytes(file.present) + ' of ' + self.bytes(file.length) + ' (' + file.percent + '%)'
        : '—')
      line('speed', self.bytes(sw.speed || 0) + '/s')
      line('peers', (sw.peers || 0) + ' connected, ' + (sw.active_peers || 0) + ' active')
      line('this run', self.bytes(sw.downloaded || 0) + ' down · ' + self.bytes(sw.uploaded || 0) + ' up')
      line('verify', src.verifying === null || src.verifying === undefined ? 'not running' : src.verifying + '%')
      line('served in', src.serve_after === null || src.serve_after === undefined
        ? '—' : src.serve_after + 's' + (src.cache_hit ? ' · from verify cache' : ''))
      line('no data', src.stalled_for ? src.stalled_for + 's · no peers with pieces missing' : 'no')
      out.push('')
      out.push('PLAYER')
      line('state', pb.state)
      line('picture in', player.picture_after === null || player.picture_after === undefined
        ? '—' : player.picture_after + 's')
      line('input read', stats.readbytes === undefined ? '—' : self.bytes(stats.readbytes))
      line('input now', pb.read_speed === undefined
        ? '—'
        : self.bytes(pb.read_speed) + '/s' +
          (pb.read_idle ? ' · nothing for ' + pb.read_idle + 's' : ''))
      line('demux read', stats.demuxreadbytes === undefined ? '—' : self.bytes(stats.demuxreadbytes))
      line('demux rate', stats.demuxbitrate === undefined ? '—' : Number(stats.demuxbitrate).toFixed(2) + '× realtime')
      line('video', 'decoded ' + self.num(stats.decodedvideo) +
        ' · shown ' + self.num(stats.displayedpictures) +
        ' · lost ' + self.num(stats.lostpictures))
      line('audio', 'decoded ' + self.num(stats.decodedaudio) +
        ' · played ' + self.num(stats.playedabuffers) +
        ' · lost ' + self.num(stats.lostabuffers))
      if (player.last_command) {
        line('last command', player.last_command.command +
          (player.last_command.replied ? ' · answered' : ' · NO REPLY'))
      }
      out.push('')
      out.push('STREAMS')
      var streams = pb.streams || []
      var ofType = function(kind) {
        return streams.filter(function(s) { return s['Type'] == kind })
      }
      var describe = function(stream) {
        var bits = [stream['Codec'] || '?']
        if (stream['Video resolution']) bits.push(stream['Video resolution'])
        if (stream['Frame rate']) bits.push(stream['Frame rate'] + ' fps')
        if (stream['Sample rate']) bits.push(stream['Sample rate'])
        if (stream['Channels']) bits.push(stream['Channels'] + ' ch')
        if (stream['Language']) bits.push(stream['Language'])
        if (stream['Description']) bits.push('(' + stream['Description'] + ')')
        return bits.join(' · ')
      }
      var videos = ofType('Video')
      var audios = ofType('Audio')
      var subs = ofType('Subtitle')
      var tracks = player.tracks || []
      var playing = function(kind) {
        return tracks.filter(function(t) { return t.kind == kind && t.current })[0]
      }
      var marker = function(track) { return track ? ' · playing ' + track.name : '' }
      if (!videos.length && !audios.length) line('streams', '—')
      videos.forEach(function(stream, i) {
        line('video' + (videos.length > 1 ? ' ' + (i + 1) : ''), describe(stream))
      })
      audios.forEach(function(stream, i) {
        line('audio' + (audios.length > 1 ? ' ' + (i + 1) : ''), describe(stream))
      })
      var subPlaying = playing('subtitle')
      line('subtitles', subs.length + ' tracks' +
        (subPlaying ? ' · playing ' + subPlaying.name : ' · none playing'))
      var languages = []
      subs.forEach(function(stream) {
        var label = stream['Language'] || ''
        if (stream['Description']) label += ' (' + stream['Description'] + ')'
        if (label && languages.indexOf(label) < 0) languages.push(label)
      })
      if (languages.length) {
        line('languages', languages.slice(0, 10).join(', ') +
          (languages.length > 10 ? ' … +' + (languages.length - 10) : ''))
      }
      if (tracks.length) {
        out.push('')
        out.push('TRACKS')
        tracks.forEach(function(track) {
          // Subtitle tracks are usually dozens; only the one showing matters.
          if (track.kind == 'subtitle' && !track.current) return
          line(track.kind + ' ' + track.id, track.name + (track.current ? ' · playing' : ''))
        })
      }
      out.push('')
      out.push('PIPELINE')
      ;(d.Pipeline || []).forEach(function(stage) {
        line(stage.name, 'pid ' + self.num(stage.pid) +
          (stage.running ? ' · up' : ' · gone') +
          (stage.ready_after === null || stage.ready_after === undefined
            ? '' : ' · ready after ' + stage.ready_after + 's'))
      })
      out.push('')
      out.push('MACHINE')
      var machine = d.Machine || {}
      line('video mem', machine.cma_total_mb
        ? self.bytes(machine.cma_free_mb * 1024 * 1024) + ' free of ' +
          self.bytes(machine.cma_total_mb * 1024 * 1024) +
          ' (' + machine.cma_free_percent + '%)'
        : '—')
      line('ram', self.bytes(machine.mem_available_mb * 1024 * 1024) + ' available · ' +
        self.bytes(machine.cached_mb * 1024 * 1024) + ' cached')
      line('disk', self.bytes(machine.disk_free_mb * 1024 * 1024) + ' free')
      line('load', machine.load)
      var logs = d.Log || {}
      var names = Object.keys(logs)
      if (names.length) {
        out.push('')
        names.forEach(function(name) {
          out.push('LOG · ' + name)
          logs[name].slice(-15).forEach(function(row) {
            out.push('  ' + String(row).replace(/^\s+/, '').slice(0, 200))
          })
        })
      }
      return out.join('\n')
    }

    closeError() {
      self.errorClosed = true
      self.update()
    }

    control(action) {
      playerStore.control(action, function(err) {
        if (err) return Utils.showError(err)
      })
    }

    doSubMinus(e) {
      self.doAction('subminus')
    }

    doSubPlus(e) {
      self.doAction('subplus')
    }

    doMinus30(e) {
      self.doAction('minus30')
    }

    doPlus30(e) {
      self.doAction('plus30')
    }

    doMinus600(e) {
      self.doAction('minus600')
    }

    doPlus600(e) {
      self.doAction('plus600')
    }

    doVolup(e) {
      self.doAction('volup')
    }

    doVoldown(e) {
      self.doAction('voldown')
    }

    doNextSub(e) {
      self.doAction('next_subtitle')
    }

    doPrevSub(e) {
      self.doAction('prev_subtitle')
    }

    doShowSub(e) {
      self.doAction('show_subtitle')
    }

    doHideSub(e) {
      self.doAction('hide_subtitle')
    }

    doPrevAudio(e) {
      self.doAction('prev_audio')
    }

    doNextAudio(e) {
      self.doAction('next_audio')
    }

    doMute(e) {
      self.doAction('mute')
    }

    addSubtitles(e) {
      // The film is already playing, so the search page is opened in the mode
      // that attaches what is picked instead of starting the film again.
      self.hideRemote()
      Utils.goRoute('subsearch', 'live', self.status.Title)
    }

    doPrevItem(e) {
      self.doAction('prev_item')
    }

    doNextItem(e) {
      self.doAction('next_item')
    }

    doAction(action) {
      playerStore.control(action, function() {}) 
    }

    stop() {
      self.control('stop')
      self.hideRemote()
    }

    pause() {
      self.control('pause')
    }

    resume() {
      self.control('resume')
    }

    togglePause() {
      self.control(self.status && self.status.Paused ? 'resume' : 'pause')
    }

    removeDialogStyle(e) {
      $('#remoteModal').removeAttr('style')
      self.showing = false
    }

    showRemote() {
      self.showing = true
      $('#remoteModal').modal('show')
      $('#remoteModal').on('hide.bs.modal', self.removeDialogStyle)
    }

    hideRemote() {
      $('#remoteModal').modal('hide')
    }

  </script>
</playbar>
