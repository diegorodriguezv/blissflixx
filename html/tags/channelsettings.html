<channelsettings>
  <div class="channel-settings">
    <p class="channel-settings-name">{ title }</p>

    <p show={ loading } class="search-note">Loading...</p>
    <p show={ errorMsg } class="alert alert-warning">{ errorMsg }</p>

    <form show={ !loading && !errorMsg } onsubmit={ save }>
      <div each={ field in shown } class="form-group">
        <label for="bf-set-{ field.key }">{ field.label }</label>

        <select if={ field.type == 'choice' }
                id="bf-set-{ field.key }"
                class="form-control"
                data-key={ field.key }
                onchange={ changed }>
          <option each={ opt in field.options }
                  value={ opt.value }
                  __selected={ opt.value == field.value }>{ opt.label }</option>
        </select>

        <input if={ field.type == 'bool' }
               id="bf-set-{ field.key }"
               class="form-control"
               type="checkbox"
               data-key={ field.key }
               __checked={ field.value }
               onchange={ changed } />

        <input if={ field.type != 'choice' && field.type != 'bool' }
               id="bf-set-{ field.key }"
               class="form-control"
               type="text"
               data-key={ field.key }
               value={ field.value }
               oninput={ typed } />

        <p class="help-block" show={ field.hint }>{ field.hint }</p>
      </div>

      <button type="submit" class="btn btn-primary btn-spacer-right">Save</button>
      <span show={ saved } class="search-note">Saved.</span>
    </form>
  </div>

  <script>
    var self = this
    self.title = ''
    self.chid = null
    self.fields = []
    self.shown = []
    self.values = {}
    self.loading = false
    self.saving = false
    self.saved = false
    self.errorMsg = ''

    // The channel can change while the tag stays mounted: the Manage Channels
    // page reuses one form for whichever row was chosen.
    //: Fields whose controlling switch is on. A setting that only means
    //: something while another is enabled is not shown while it is off.
    function refreshShown() {
      self.shown = self.fields.filter(function(field) {
        return !field.depends_on || !!self.values[field.depends_on]
      })
    }

    function sync() {
      if (opts.chid && opts.chid !== self.chid) {
        self.chid = opts.chid
        self.load()
      }
    }

    // `update` covers a parent changing the channel; `mount` covers the first
    // render, where the script may be built after that update has happened.
    this.on('update', sync)
    this.on('mount', sync)

    load() {
      if (!self.chid) return
      self.loading = true
      self.saved = false
      self.errorMsg = ''
      self.update()
      channelStore.getConfig(self.chid, function(err, data) {
        self.loading = false
        if (err) {
          self.errorMsg = Utils.decodeURI(err)
          return self.update()
        }
        self.title = data.title
        self.values = data.values || {}
        self.fields = (data.schema || []).map(function(field) {
          return {
            key: field.key,
            label: field.label || field.key,
            type: field.type || 'text',
            hint: field.hint || '',
            value: self.values[field.key],
            depends_on: field.depends_on || null,
            options: (field.choices || []).map(function(choice) {
              if (typeof choice === 'string') {
                return {value: choice, label: choice}
              }
              return {value: choice.value, label: choice.label || choice.value}
            })
          }
        })
        refreshShown()
        self.update()
      })
    }

    //: Typing in a text field. No update(): the input already shows what was
    //: typed, and re-rendering it here would move the cursor to the end after
    //: every character. `save()` reads the fields again in case something was
    //: typed and the field never blurred.
    typed(e) {
      var key = e.target.getAttribute('data-key')
      var value = e.target.value
      self.values[key] = value
      for (var i = 0; i < self.fields.length; i++) {
        if (self.fields[i].key === key) {
          self.fields[i].value = value
          break
        }
      }
      self.saved = false
    }

    //: Read every control's current value. `self.values` is updated as the
    //: person types, but this is the authoritative read at Save time: a value
    //: typed and then submitted without leaving the field never fired change.
    collect() {
      var nodes = self.root ? self.root.querySelectorAll('[data-key]') : []
      for (var i = 0; i < nodes.length; i++) {
        var key = nodes[i].getAttribute('data-key')
        if (!key) continue
        self.values[key] = nodes[i].type === 'checkbox'
          ? nodes[i].checked
          : nodes[i].value
      }
    }

    changed(e) {
      var key = e.target.getAttribute('data-key')
      var value = e.target.type === 'checkbox' ? e.target.checked : e.target.value
      self.values[key] = value
      // Keep the rendered field in step with the value. The template draws
      // the control from the field, so without this the re-render after a
      // change puts the old selection back.
      for (var i = 0; i < self.fields.length; i++) {
        if (self.fields[i].key === key) {
          self.fields[i].value = value
          break
        }
      }
      self.saved = false
      refreshShown()
      self.update()
    }

    save(e) {
      if (e) e.preventDefault()
      if (self.saving) return
      self.collect()
      self.saving = true
      channelStore.setConfig(self.chid, self.values, function(err) {
        self.saving = false
        if (err) {
          self.errorMsg = Utils.decodeURI(err)
          return self.update()
        }
        self.saved = true
        self.update()
        // Back to the list this was opened from, saying so there: the form is
        // about to be gone.
        Utils.flash('Saved.')
        if (window.history.length > 1) {
          window.history.back()
        } else {
          Utils.goRoute('chanman')
        }
      })
    }
  </script>
</channelsettings>
