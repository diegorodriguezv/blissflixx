<topnav>
  <div class="navibar topnav">
    <div class="container">
      <ul class="navitems navitems-left">
        <li>
          <!--
          The way home, which is the channels: the main page and the channel
          list are the same page, and there is no Channels page to go to.

          href="#" and not href="": an empty href resolves to the current
          document and clicking it does nothing at all, which is the bug the
          channel rows in the manager had. "#" clears the fragment instead, the
          router hears the change and shows the main page. It is not a
          reload -- a full reload would drop whatever is playing, which is why
          UpdateCheck goes to such lengths over a build change.
          -->
          <a href="#"><i class="fa fa-film"></i><span> BLISSFLIXX</span></a>
        </li>
      </ul>
      <ul class="navitems navitems-right">
        <li each={ pages }>
          <a data-toggle="tooltip" title={ title } href="{ link  }"><i class="fa { icon }"></i></a>
        </li>
      </ul>
    </div>
  </div>

  <script>
    var self = this

    this.on('mount', function() {
      $(function () {
        $('[data-toggle="tooltip"]').tooltip()
      })
    })

    this.pages = [
      {link:"#settings", icon:"fa-cog", title:"Settings"},
      {link:"#search", icon:"fa-search", title:"Search"},
      {link:"#play", icon:"fa-play", title:"Play URL"},
      {link:"#playlists", icon:"fa-th-list", title:"Playlists"},
      // No Channels entry, because there is no Channels page. The channels are
      // the main page -- which is what the name on the left is a link to.
    ]
  </script>
</topnav>
