<app>
  <topnav></topnav>

  <div class="container" id="page"></div>

  <playbar></playbar>

  <!-- The way back up, for a list that runs to a thousand rows. Hidden until
       the page has been scrolled far enough that walking back is work. -->
  <a show={ showTop } href="" onclick={ backToTop } class="bf-top" title="Back to top">
    <i class="fa fa-arrow-up"></i>
  </a>

  <script>
    var self = this
    self.mountedTag = null
    self.loadedTags = {}

    //: How far down the page has to be before the button is worth showing.
    //: About one screen of a phone, so it arrives before the top of the page is
    //: out of sight and not merely because a page is longer than the window.
    var TOP_AFTER = 400

    this.on('mount', function() {
      self.bindCtrlKeys()
      self.showTop = false
      $(window).on('scroll', self.updateTopButton)
      riot.route.exec(function(page) {
        self.loadPage(page)
      })
    })

    this.on('unmount', function() {
      $(window).off('scroll', self.updateTopButton)
    })

    updateTopButton() {
      // Only when it changes: this runs on every scroll event, and re-rendering
      // the tag on each one is a lot of work for a button that has not moved.
      var show = $(window).scrollTop() > TOP_AFTER
      if (show !== self.showTop) {
        self.showTop = show
        self.update()
      }
    }

    backToTop() {
      // Animated rather than set, so it is clear what happened: the page
      // travels back rather than being replaced at the top. jQuery does this
      // for both elements because browsers disagree about which one scrolls.
      $('html, body').animate({ scrollTop: 0 }, 300)
    }

    loadPage(page) {
      page = page || 'channels'
      if (self.mountedTag) {
        self.mountedTag.unmount()
      }
      if (!self.loadedTags[page]) {
        // With the build on the URL, for the same reason the scripts have it:
        // a new build means a new URL, so a cached copy of a page is never
        // asked for again. The document cannot stamp these -- they are fetched
        // here, at runtime, once per route -- so it hands the build down and it
        // is put on here.
        riot.compile('pages/' + page + '.html?v=' + (window.BF_BUILD || ''), function() {
          self.loadedTags[page] = true
          self.mountPage(page)
        })
      } else {
        self.mountPage(page)
      }
    }

    mountPage(page) {
      self.mountedTag = riot.mount('div#page', page)[0]
    }

    riot.route(function(page) {
      self.loadPage(page)
    })

    bindCtrlKeys() {
      $(document).keydown(function(e) {
        if (e.ctrlKey || e.altKey) return	      
        var tag = e.target.tagName.toLowerCase(e)
        if (tag == 'input' || tag == 'textarea') return
        var status = playerStore.getStatus()
        if (status.State < 3) return
        var action = null
        switch (e.key) {
          case " ": // space
          case "p":
            action = status.Paused ? 'resume' : 'pause'
            break
          case "q":
            action = 'stop'
            break
          case "ArrowLeft":
            action = 'minus30'
            break
          case "ArrowRight":
            action = 'plus30'
            break
          case "ArrowDown":
            action = 'minus600'
            break
          case "ArrowUp":
            action = 'plus600'
            break
          case "d":
            action = 'subminus'
            break
          case "f":
            action = 'subplus'
            break
          case "-":
            action = 'voldown'
            break
          case "+":
          case "=":            
            action = 'volup'
            break
        }
        if (action) {
          playerStore.control(action, function() {})
          e.preventDefault()
        }
      })
    }
  </script>
</app>
